[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dressup-pipeline"
version = "0.1.0"
description = "Scanned sticker-book PDFs -> dress-me-up app catalog"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "Pillow>=10.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dressup_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
